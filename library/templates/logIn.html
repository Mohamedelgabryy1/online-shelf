{%load static%}
<!DOCTYPE html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Online Shelf</title>
    <link rel="stylesheet" href="{% static 'css/Login-styling.css' %}" />
</head>

<body>
    <header>
        <div class="container">
            <h1 class="logo"><a href="{% url 'home' %}">Online Shelf</a></h1>
            </div>
    </header>

    <div class="login-container">
        <section class="login-box">
            <h2>Welcome Back</h2>
            <form class="login-form" method="POST">
                {% csrf_token %}
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required />
            
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required />
            
                {% if messages %}
                    <div class="error-message">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}

                <button type="submit" class="login-btn">Log In</button>
                <p class="signup-link">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
            </form>
        </section>
    </div>

    <footer>
        <div class="container">
            <p>2025 Online Shelf.</p>
        </div>
    </footer>

    <script src="{% static 'js/shared.js' %}"></script>
    <script src="{% static 'js/login-script.js' %}"></script>
</body>

</html>
